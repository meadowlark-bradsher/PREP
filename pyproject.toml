[project]
name = "predictive-review"
version = "0.1.0"
description = "Predictive Review — prior elicitation with reconciliation for AI-assisted code authorship"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "unidiff>=0.7.5",
    "anthropic>=0.40",
    "click>=8.1",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.scripts]
prep = "predictive_review.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_review"]
